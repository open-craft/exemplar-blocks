[project]
name = "exemplar-blocks"
version = "0.2.0"
description = "A collection of XBlocks for managing and displaying aesthetically pleasing HTML content"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11.8"
dependencies = [
    "xblock>=5.3.0",
]

[project.entry-points."xblock.v1"]
cover = "exemplar_blocks.cover_block:CoverBlock"
two_column = "exemplar_blocks.two_column_block:TwoColumnBlock"
card_carousel = "exemplar_blocks.card_carousel:CardCarouselXBlock"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs>=5.2.9",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-django>=4.12.0",
    "ruff>=0.15.1",
    "xblock-sdk>=0.13.0",
]

[[tool.mypy.overrides]]
module = ["xblock.*", "web_fragments.*"]
# Attempt to infer types as best as possible.
follow_untyped_imports = true

[tool.uv]
package = true
