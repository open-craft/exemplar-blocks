variables:
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - test

quality:
  stage: test
  image: astral/uv:python3.11-alpine
  script:
    - apk add mise
    - mise run install
    - mise run init_sdk
    - mise run quality

test:
  stage: test
  image: astral/uv:python3.11-alpine
  script:
    - apk add mise
    - mise run install
    - mise run init_sdk
    - mise run test-python
