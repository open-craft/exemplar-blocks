variables:
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - test

quality:
  stage: test
  image: astral/uv:python3.11-alpine
  script:
    - apk add mise git pnpm
    - (cd frontend && pnpm install)
    - mise run install
    - mise run init_sdk
    - mise run quality
    - mise run sync-types
    # If the types were out of sync, there will be a git diff here.
    - git diff --exit-code

test:
  stage: test
  image: astral/uv:python3.11-alpine
  script:
    - apk add mise
    - mise run install
    - mise run init_sdk
    - mise run test-python

frontend quality:
  stage: test
  image: node:24-alpine
  script:
    - apk add pnpm
    - cd frontend
    - pnpm install
    - pnpm run lint

frontend build:
  stage: test
  image: node:24-alpine
  script:
    - apk add pnpm git
    - cd frontend
    - pnpm install
    - XBLOCK=card_carousel pnpm run build
    - XBLOCK=keypoint_block pnpm run build
    - XBLOCK=cover_block pnpm run build
    - XBLOCK=two_column_block pnpm run build
    # Check build artefacts are up to date.
    # The frontend build artefacts are committed to the repo.
    # If there are changes in the repo after the build commands above, then the build artefacts aren't up to date.
    - git diff --exit-code

frontend test:
  stage: test
  image: node:24-alpine
  script:
    - apk add pnpm git
    - cd frontend
    - pnpm install
    - pnpm run test
