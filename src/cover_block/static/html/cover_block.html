<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
{% if self.dev_mode %}
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
{% endif %}
<div class="container-fluid cover-block px-0">
    <div class="row g-0">
        <div class="col col-12 col-lg-6 order-lg-2">
            <img class="cover-block-image" src="{{self.media_url}}" alt="{{ self.media_alt_text }}">
        </div>
        <div class="col col-12 col-lg-6 px-4 pt-5 align-content-center order-lg-1">
            <div class="text-content mx-0 me-sm-2 me-md-0 ms-lg-4 ms-lg-5">
                <div class="lead">{{self.top_header}}</div>
                <h1 class="display-1">{{self.main_header}}</h1>
                <p class="subtitle my-3">{{self.subheader}}</p>
                <p class="body">{{self.description}}</p>
            </div>
        </div>
    </div>
</div>
